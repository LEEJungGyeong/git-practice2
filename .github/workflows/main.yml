name: My First GitHub Action

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Build
        run: exit 1

      - name: Success Message
        if: ${{ success() }}
        run: echo "빌드 성공!"

      - name: Failure Message
        if: ${{ failure() }}
        run: echo "빌드 실패!"

  test:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Test
        run: echo "테스트 시작!"
