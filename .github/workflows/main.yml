name: My First GitHub Action

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'

jobs:
  container-test:
    runs-on: ubuntu-latest

    container:
      image: python:3.11

    steps:
      - name: Check Python
        run: python --version

      - name: Hello
        run: python -c "print('Hello from container!')"
