name: My First GitHub Action

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'

jobs:
  secret-test:
    runs-on: ubuntu-latest

    steps:
      - name: Use Secret
        env:
          MY_KEY: ${{ secrets.MY_TEST_SECRET }}
        run: |
          if [ -n "$MY_KEY" ]; then
            echo "Secret 전달 성공!"
          else
            echo "Secret 전달 실패!"
            exit 1
          fi
