name: My First GitHub Action

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'

jobs:
  hello:
    runs-on: ubuntu-latest

    steps:
      - name: Step 1 - Start
        run: echo "자동화 시작!"

      - name: Step 2 - Check Environment
        run: |
          echo "현재 작업 위치:"
          pwd
          echo "운영체제:"
          uname -s

      - name: Step 3 - Finish
        run: echo "모든 작업 완료!"
